[project]
name = "bipartite-maximum-matching"
version = "0.1.0"
description = "Finds a maximum-cardinality matching in a bipartite graph using augmenting paths via depth-first search."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
